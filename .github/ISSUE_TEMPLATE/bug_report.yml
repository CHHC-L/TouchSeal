name: Bug report
description: Something in TouchSeal does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste API keys, passwords, Keychain contents, or other secrets
        into an issue** — not even expired ones. Replace any real value with a
        placeholder such as `sk-ant-REDACTED`, and check that pasted terminal
        output and screenshots contain no secret material.

        If this is a security vulnerability, please report it privately instead:
        https://github.com/CHHC-L/TouchSeal/security/advisories

  - type: checkboxes
    id: no-secrets
    attributes:
      label: Secret check
      options:
        - label: I have confirmed this report contains no real secrets.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran, with secrets redacted.
      render: shell
    validations:
      required: true

  - type: input
    id: exit-code
    attributes:
      label: Exit code
      description: The output of `echo $?` after the failing command.

  - type: input
    id: touchseal-version
    attributes:
      label: TouchSeal version
      description: The output of `touchseal version`.
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: The `ProductVersion` and `BuildVersion` from `sw_vers`.
    validations:
      required: true

  - type: textarea
    id: signing
    attributes:
      label: Code signature
      description: >-
        The output of
        `codesign -dv --entitlements - "$(which touchseal)"`.
        Most Keychain failures come down to this.
      render: shell

  - type: input
    id: hardware
    attributes:
      label: Mac model
      description: Apple silicon or Intel, and whether Touch ID is present and enrolled.
